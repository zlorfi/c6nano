###############################################################
# M5Stack NanoC6 - ESPHome Configuration
# Chip: ESP32-C6FH4 (RISC-V, 160MHz, 4MB flash)
# Onboard hardware:
#   - RGB LED (WS2812)  -> GPIO20 (data), GPIO19 (power)
#   - Status LED (blue) -> GPIO7
#   - Button            -> GPIO9
#   - IR Transmitter    -> GPIO3
#   - Grove I2C: SDA    -> GPIO2, SCL -> GPIO1
###############################################################

substitutions:
  device_name: m5stack-nanoc6
  friendly_name: "M5Stack NanoC6"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  comment: "M5Stack NanoC6 with Bluetooth Proxy"
  platformio_options:
    board_build.f_cpu: 160000000L
    board_build.f_flash: 80000000L
    board_build.flash_size: 4MB

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  # flash_size: 4MB
  framework:
    type: esp-idf
    # version: "5.3.2" # Exact version supported by ESPHome 2025.12.4
    # platform_version: "6.7.0" # Exact platform that includes IDF 5.3.2
    # platform_version: 6.1.19
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y

# ── Network ──────────────────────���───────────────────��────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  manual_ip:
    # Set this to the IP of the ESP
    static_ip: 192.168.20.32
    # Set this to the IP address of the router. Often ends with .1
    gateway: 192.168.20.1
    # The subnet of the network. 255.255.255.0 works for most home networks.
    subnet: 255.255.255.0
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# ── Core services ────��────────────────────────────────────
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

# ── Bluetooth Proxy ──────────────────────────────────────�����─
bluetooth_proxy:
  active: true

esp32_ble_tracker:
  scan_parameters:
    active: true

# ── IR Transmitter ────────────────────────�����────────────────
remote_transmitter:
  pin: GPIO3
  carrier_duty_percent: 50%

# ── RGB LED (WS2812, onboard) ──────────────���───────────────
light:
  - platform: esp32_rmt_led_strip
    id: rgb_led
    name: "RGB LED"
    icon: "mdi:led-outline"
    pin: GPIO20
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    is_rgbw: false
    effects:
      - random:
      - flicker:
      - addressable_rainbow:

# ── Switches ─────────────────────────────────────�����─────────
switch:
  - platform: gpio
    id: rgb_power
    pin: GPIO19
    name: "RGB Power"
    restore_mode: ALWAYS_ON

  - platform: gpio
    id: status_led
    pin: GPIO7
    name: "Status LED"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: restart
    name: "Restart"
    entity_category: diagnostic

  - platform: factory_reset
    name: "Factory Reset"
    entity_category: diagnostic

# ── Button ────���───────────────────�──────────────────────
binary_sensor:
  - platform: gpio
    id: onboard_button
    name: "Button"
    pin:
      number: GPIO9
      inverted: true
    on_press:
      then:
        - light.toggle: rgb_led

# ── Diagnostic sensors ─────────────────────────────────�����───
sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

# ── Safe mode boot button ────────────────────�����─────────────
button:
  - platform: safe_mode
    name: "Safe Mode Boot"
    entity_category: diagnostic

# ── Webserver ──────────────────────────────────────────────
web_server:
  port: 80
